name: Profile Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate repository-owned public telemetry
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: nithin-builds
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Calcutta
          plugins_errors_fatal: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4

      - name: Reject embedded telemetry errors
        shell: bash
        run: |
          if grep -Eqi 'unexpected error|bad credentials|insufficient token scopes|rate limit' github-metrics.svg; then
            echo 'Generated telemetry contains an embedded error' >&2
            exit 1
          fi
